name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-requirements-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run syntax check (py_compile)
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Run formatters/linters (optional)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # these checks are helpful but optional; failures can be addressed separately
          black --check . || true
          isort --check-only . || true
          flake8 || true

      - name: Run type checks and tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mypy --ignore-missing-imports . || true
          pytest -q

      - name: Upload coverage artifact (if generated)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml || coverage.txt || .

    test-faiss:
      runs-on: ubuntu-latest
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      strategy:
        matrix:
          python-version: [3.11]
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: ${{ matrix.python-version }}

        - name: Cache pip (faiss job)
          uses: actions/cache@v4
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ matrix.python-version }}-faiss-${{ hashFiles('requirements-faiss.txt') }}
            restore-keys: |
              ${{ runner.os }}-pip-${{ matrix.python-version }}-faiss-

        - name: Install FAISS and heavy deps
          run: |
            python -m pip install --upgrade pip
            if [ -f requirements-faiss.txt ]; then pip install -r requirements-faiss.txt; fi

        - name: Run FAISS smoke test
          env:
            PYTHONPATH: ${{ github.workspace }}
          run: |
            # minimal smoke test to ensure FAISS imports and basic functions
            python - <<'PY'
            try:
                import faiss
                print('faiss OK')
            except Exception as e:
                print('faiss import failed:', e)
                raise
            PY
