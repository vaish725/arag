name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # 3.14 is what Streamlit Cloud runs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-requirements-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint workflow files (actionlint)
        if: matrix.python-version == '3.12'
        uses: raven-actions/actionlint@v2

      - name: Run syntax check (py_compile)
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Run formatters/linters (optional)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          black --check . || true
          isort --check-only . || true
          flake8 || true

      # The regression tests use the real local embedding model. Download it once
      # (cached across runs) BEFORE pytest; pytest then runs with HF_HUB_OFFLINE=1
      # so nothing is fetched during the tests.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5-v1

      - name: Download embedding model
        env:
          PYTHONPATH: ${{ github.workspace }}
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
        run: python scripts/download_model.py

      - name: Run type checks and tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
          HF_HUB_OFFLINE: '1'
          ARAG_REQUIRE_MODEL: '1'
        run: |
          mypy --ignore-missing-imports . || true
          pytest -q
